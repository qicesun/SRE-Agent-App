# DO NOT COMMIT SECRETS.
# Provide credentials via environment variables or a local, untracked override file.

# OpenAI / LangChain4j
langchain4j.open-ai.api-key=${OPENAI_API_KEY:}
langchain4j.open-ai.model=${OPENAI_MODEL:gpt-5-nano}
langchain4j.open-ai.temperature=${OPENAI_TEMPERATURE:1.0}

# GitLab
gitlab.url=${GITLAB_URL:}
gitlab.token=${GITLAB_TOKEN:}

# Jira
jira.url=${JIRA_URL:}
jira.email=${JIRA_EMAIL:}
jira.token=${JIRA_TOKEN:}

logging.level.com.qicesun.sreagent=INFO
spring.mvc.async.request-timeout=-1
